
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة المتفوقين</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
      text-align: center;
    }

    header {
      background: #17365d;
      color: white;
      padding: 35px 15px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .slogan {
      color: #f4d58d;
      margin-top: 12px;
    }

    main {
      padding: 35px 15px;
    }

    .welcome {
      background: white;
      padding: 25px;
      border-radius: 15px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 2px 10px #ddd;
    }
  </style>
</head>

<body>
  <header>
    <h1>المتفوقين</h1>
    <p class="slogan">هدفنا التفوق وليس مجرد نجاح</p>
  </header>

  <main>
    <section class="welcome">
      <h2>أهلاً بيك في منصة المتفوقين</h2>
      <p>رحلتك نحو التفوق تبدأ من هنا.</p>
    </section>
  </main>
</body>
</html>
